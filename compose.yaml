services:
  checker:
    build:
      context: ./checker
    env_file:
      - .env
    environment:
      SIGNAL_API_URL: http://signal-api:8080
    depends_on:
      - signal-api
    restart: unless-stopped

  signal-api:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: canyon-signal-api
    environment:
      MODE: normal
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - signal-data:/home/.local/share/signal-cli
    restart: unless-stopped

volumes:
  signal-data:
